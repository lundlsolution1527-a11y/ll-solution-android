name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android-Projekt sauber entpacken
        run: |
          rm -rf app build .gradle
          unzip -o ll-solution-android-source.zip

      - name: Auto-Update der Web-App aktivieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/de/llsolution/app/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          pattern = r'(\b\w+)\.loadUrl\("https://ll-solutions-app\.netlify\.app/(?:\?v=\d+)?"\);'
          m = re.search(pattern, s)
          if not m:
              raise SystemExit("L&L-WebView loadUrl wurde nicht gefunden – Build wird sicherheitshalber abgebrochen.")

          var = m.group(1)
          replacement = (
              f'{var}.getSettings().setCacheMode(android.webkit.WebSettings.LOAD_NO_CACHE);\n'
              f'        {var}.clearCache(true);\n'
              f'        {var}.loadUrl("https://ll-solutions-app.netlify.app/?_native=" + System.currentTimeMillis());'
          )
          s = re.sub(pattern, replacement, s, count=1)
          p.write_text(s, encoding="utf-8")
          print("Auto-Update aktiv. Starre Versions-URL entfernt.")
          PY

          grep -n "ll-solutions-app.netlify.app" app/src/main/java/de/llsolution/app/MainActivity.java
          ! grep -Eq 'll-solutions-app\.netlify\.app/\?v=[0-9]+' app/src/main/java/de/llsolution/app/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK sauber neu bauen
        run: gradle --no-daemon clean assembleDebug

      - name: APK kontrollieren
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LL-Solution-AUTO-UPDATE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
