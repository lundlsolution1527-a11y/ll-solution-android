name: APK Update Diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android-Projekt entpacken
        run: |
          rm -rf app build .gradle
          unzip -o ll-solution-android-source.zip

      - name: Paket und Version anzeigen
        run: |
          echo "===== APP BUILD CONFIG ====="
          cat app/build.gradle.kts
          echo "===== MANIFEST ====="
          cat app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK neu bauen
        run: gradle --no-daemon clean assembleDebug

      - name: APK Identitaet und Signatur pruefen
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          echo "===== APK DATEI ====="
          ls -lh "$APK"
          echo "===== APK SIGNATUR ====="
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose --print-certs "$APK"
          echo "===== APK PACKAGE/VERSION ====="
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt dump badging "$APK" | head -5
