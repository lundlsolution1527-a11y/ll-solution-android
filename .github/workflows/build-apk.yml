name: Build APK Auto Update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android-Projekt sauber entpacken
        run: |
          rm -rf app build .gradle
          unzip -o ll-solution-android-source.zip

      - name: Auto-Update exakt aktivieren
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/de/llsolution/app/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          old_url = 'private static final String APP_URL = "https://ll-solutions-app.netlify.app/?v=6135";'
          new_url = 'private static final String APP_URL = "https://ll-solutions-app.netlify.app/";'

          if old_url not in s:
              raise SystemExit("Erwartete V6.13-URL nicht gefunden – sicherer Abbruch.")

          s = s.replace(old_url, new_url, 1)

          old_ua = 'settings.setUserAgentString(settings.getUserAgentString() + " LLSolutionAndroid/6.13");'
          new_ua = 'settings.setUserAgentString(settings.getUserAgentString() + " LLSolutionAndroid");'
          if old_ua in s:
              s = s.replace(old_ua, new_ua, 1)

          marker = "settings.setMediaPlaybackRequiresUserGesture(false);"
          cache_line = "settings.setCacheMode(WebSettings.LOAD_DEFAULT);"
          if cache_line not in s:
              if marker not in s:
                  raise SystemExit("WebSettings-Marker nicht gefunden – sicherer Abbruch.")
              s = s.replace(marker, marker + "\n        " + cache_line, 1)

          p.write_text(s, encoding="utf-8")
          PY

          grep -n 'APP_URL\|setCacheMode\|LLSolutionAndroid' app/src/main/java/de/llsolution/app/MainActivity.java
          grep -q 'private static final String APP_URL = "https://ll-solutions-app.netlify.app/";' app/src/main/java/de/llsolution/app/MainActivity.java
          grep -q 'setCacheMode(WebSettings.LOAD_DEFAULT)' app/src/main/java/de/llsolution/app/MainActivity.java
          ! grep -q '?v=6135' app/src/main/java/de/llsolution/app/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK sauber neu bauen
        run: gradle --no-daemon clean assembleDebug

      - name: APK kontrollieren
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LL-Solution-AUTO-UPDATE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
