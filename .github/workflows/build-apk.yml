name: Diagnose Android Source

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android-Projekt sauber entpacken
        run: |
          rm -rf app build .gradle
          unzip -o ll-solution-android-source.zip

      - name: MainActivity anzeigen
        run: |
          echo "===== MAINACTIVITY START ====="
          cat app/src/main/java/de/llsolution/app/MainActivity.java
          echo "===== MAINACTIVITY ENDE ====="

      - name: Android-Konfiguration anzeigen
        run: |
          echo "===== BUILD.GRADLE.KTS ====="
          cat app/build.gradle.kts
          echo "===== MANIFEST ====="
          cat app/src/main/AndroidManifest.xml
