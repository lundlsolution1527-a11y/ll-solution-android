name: Build Final Signed V7 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android-Projekt sauber entpacken
        run: |
          rm -rf app build .gradle
          unzip -o ll-solution-android-source.zip

      - name: V7 Auto-Update Wrapper vorbereiten
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/de/llsolution/app/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          s2, n = re.subn(
              r'https://ll-solutions-app\.netlify\.app/(?:\?v=[^"]*)?',
              'https://ll-solutions-app.netlify.app/',
              s
          )
          if n < 1:
              raise SystemExit("Netlify APP_URL nicht gefunden – sicherer Abbruch.")

          s2 = re.sub(r'LLSolutionAndroid/[0-9.]+', 'LLSolutionAndroid', s2)

          if "setCacheMode(WebSettings.LOAD_DEFAULT)" not in s2:
              marker = "settings.setMediaPlaybackRequiresUserGesture(false);"
              if marker not in s2:
                  raise SystemExit("WebSettings-Marker nicht gefunden – sicherer Abbruch.")
              s2 = s2.replace(marker, marker + "\n        settings.setCacheMode(WebSettings.LOAD_DEFAULT);", 1)

          p.write_text(s2, encoding="utf-8")

          g = Path("app/build.gradle.kts")
          t = g.read_text(encoding="utf-8")
          t, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 700', t, count=1)
          t, b = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "7.0-wrapper"', t, count=1)
          if a != 1 or b != 1:
              raise SystemExit("Versionsfelder nicht eindeutig gefunden – sicherer Abbruch.")
          g.write_text(t, encoding="utf-8")
          PY

          grep -q 'https://ll-solutions-app.netlify.app/' app/src/main/java/de/llsolution/app/MainActivity.java
          ! grep -q 'netlify.app/?v=' app/src/main/java/de/llsolution/app/MainActivity.java
          grep -q 'versionCode = 700' app/build.gradle.kts
          grep -q 'versionName = "7.0-wrapper"' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Release-Keystore aus GitHub Secret herstellen
        env:
          KEYSTORE_B64: ${{ secrets.LL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ll-solution-release.jks"
          test -s "$RUNNER_TEMP/ll-solution-release.jks"

      - name: Debug APK bauen
        run: gradle --no-daemon clean assembleDebug

      - name: APK dauerhaft signieren
        env:
          STORE_PASS: ${{ secrets.LL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LL_KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED=app/build/outputs/apk/debug/app-debug.apk
          FINAL=app/build/outputs/apk/debug/LL-Solution-V7-FINAL.apk
          test -f "$UNSIGNED"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/ll-solution-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out "$FINAL" \
            "$RUNNER_TEMP/aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs "$FINAL"
          unzip -t "$FINAL"

      - name: Paket und Version kontrollieren
        run: |
          FINAL=app/build/outputs/apk/debug/LL-Solution-V7-FINAL.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$FINAL" | head -5
          "$AAPT" dump badging "$FINAL" | grep -q "package: name='de.llsolution.app' versionCode='700' versionName='7.0-wrapper'"

      - uses: actions/upload-artifact@v4
        with:
          name: LL-Solution-V7-FINAL-DAUERHAFT-SIGNIERT
          path: app/build/outputs/apk/debug/LL-Solution-V7-FINAL.apk
          if-no-files-found: error
