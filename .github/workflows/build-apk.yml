name: Build APK Auto Update V7 Wrapper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android-Projekt sauber entpacken
        run: |
          rm -rf app build .gradle
          unzip -o ll-solution-android-source.zip

      - name: Auto-Update und Wrapper-Version aktivieren
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("app/src/main/java/de/llsolution/app/MainActivity.java")
          s = main.read_text(encoding="utf-8")

          old_url = 'private static final String APP_URL = "https://ll-solutions-app.netlify.app/?v=6135";'
          new_url = 'private static final String APP_URL = "https://ll-solutions-app.netlify.app/";'
          if old_url not in s:
              raise SystemExit("Erwartete V6.13-URL nicht gefunden – sicherer Abbruch.")
          s = s.replace(old_url, new_url, 1)

          old_ua = 'settings.setUserAgentString(settings.getUserAgentString() + " LLSolutionAndroid/6.13");'
          new_ua = 'settings.setUserAgentString(settings.getUserAgentString() + " LLSolutionAndroid");'
          if old_ua in s:
              s = s.replace(old_ua, new_ua, 1)

          marker = "settings.setMediaPlaybackRequiresUserGesture(false);"
          cache_line = "settings.setCacheMode(WebSettings.LOAD_DEFAULT);"
          if cache_line not in s:
              if marker not in s:
                  raise SystemExit("WebSettings-Marker nicht gefunden – sicherer Abbruch.")
              s = s.replace(marker, marker + "\n        " + cache_line, 1)

          main.write_text(s, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          if 'versionCode = 613' not in g or 'versionName = "6.13"' not in g:
              raise SystemExit("Erwartete alte Versionsdaten nicht gefunden – sicherer Abbruch.")
          g = g.replace('versionCode = 613', 'versionCode = 700', 1)
          g = g.replace('versionName = "6.13"', 'versionName = "7.0-wrapper"', 1)
          gradle.write_text(g, encoding="utf-8")
          PY

          grep -n 'APP_URL\|setCacheMode\|LLSolutionAndroid' app/src/main/java/de/llsolution/app/MainActivity.java
          grep -n 'applicationId\|versionCode\|versionName' app/build.gradle.kts
          grep -q 'applicationId = "de.llsolution.app"' app/build.gradle.kts
          grep -q 'versionCode = 700' app/build.gradle.kts
          grep -q 'versionName = "7.0-wrapper"' app/build.gradle.kts
          ! grep -q '?v=6135' app/src/main/java/de/llsolution/app/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK sauber neu bauen
        run: gradle --no-daemon clean assembleDebug

      - name: APK kontrollieren
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          AAPT=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt
          "$AAPT" dump badging "$APK" | head -5
          "$AAPT" dump badging "$APK" | grep -q "package: name='de.llsolution.app' versionCode='700' versionName='7.0-wrapper'"

      - uses: actions/upload-artifact@v4
        with:
          name: LL-Solution-V7-WRAPPER-AUTO-UPDATE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
