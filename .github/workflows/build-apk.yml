name: Signatur Vergleich

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Alte funktionierende APK aus Build 2 laden
        run: |
          mkdir -p old-apk
          gh api repos/${{ github.repository }}/actions/artifacts/10884331719/zip > old.zip
          unzip -o old.zip -d old-apk
          find old-apk -type f -maxdepth 2 -print

      - name: Aktuelle Android-Quelle entpacken
        run: |
          rm -rf app build .gradle
          unzip -o ll-solution-android-source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aktuelle APK bauen
        run: gradle --no-daemon clean assembleDebug

      - name: Signaturen vergleichen
        run: |
          OLD=$(find old-apk -type f -name '*.apk' | head -1)
          NEW=app/build/outputs/apk/debug/app-debug.apk
          test -n "$OLD"
          test -f "$NEW"
          APKSIGNER=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner
          AAPT=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt

          echo "===== ALTE FUNKTIONIERENDE APK ====="
          "$AAPT" dump badging "$OLD" | head -3
          "$APKSIGNER" verify --verbose --print-certs "$OLD"

          echo "===== AKTUELL NEU GEBAUTE APK ====="
          "$AAPT" dump badging "$NEW" | head -3
          "$APKSIGNER" verify --verbose --print-certs "$NEW"

          OLD_CERT=$("$APKSIGNER" verify --print-certs "$OLD" | grep -m1 'certificate SHA-256 digest' | sed 's/.*: //')
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$NEW" | grep -m1 'certificate SHA-256 digest' | sed 's/.*: //')

          echo "===== ERGEBNIS ====="
          echo "ALT: $OLD_CERT"
          echo "NEU: $NEW_CERT"
          if [ "$OLD_CERT" = "$NEW_CERT" ]; then
            echo "SIGNATUREN_IDENTISCH=JA"
          else
            echo "SIGNATUREN_IDENTISCH=NEIN"
          fi
